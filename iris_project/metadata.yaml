name: iris_classifier
description: Tested Iris decision-tree pipeline with evaluation branch.
blocks:
  - uuid: load_iris
    type: data_loader
  - uuid: prepare_data
    type: transformer
  - uuid: train_model
    type: transformer
    downstream:
      - save_results
      - evaluate_model
  - uuid: save_results
    type: data_exporter
  - uuid: evaluate_model
    type: data_exporter
    downstream:
      - export_metrics
  - uuid: export_metrics
    type: data_exporter
tests:
  - train_model
  - save_results
  - evaluate_model
  - export_metrics

